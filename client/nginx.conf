server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Proxy API + SSE to the backend service (named "api" in docker-compose).
  # Override the upstream with the API_UPSTREAM build/runtime arg if needed.
  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # Server-Sent Events: disable buffering and keep the connection open.
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # SPA fallback — every non-file route serves index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
